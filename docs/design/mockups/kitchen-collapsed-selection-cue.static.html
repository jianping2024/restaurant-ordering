<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后厨大屏 · 收起组头已选（静态稿）</title>
  <style>
    :root {
      --bg: 237 234 226;
      --card: 247 244 238;
      --ink: 31 62 82;
      --ink-muted: 138 131 119;
      --gold: 139 101 48;
      --on-gold: 255 250 240;
      --border: 186 178 164;
      --text: 26 22 18;
      --slate: 241 245 249;
      --sans: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
      --frac-w: 3.1rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: rgb(var(--text));
      background: rgb(var(--bg));
    }
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.35rem;
      margin: 0 0 4px;
    }
    .lede {
      margin: 0 0 20px;
      color: rgb(var(--ink-muted));
      font-size: 0.88rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      border: 1px solid rgb(var(--border));
      background: rgb(var(--card));
      border-radius: 14px;
      padding: 10px;
      min-width: 0;
    }
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 650;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
      background: rgb(var(--gold) / 0.15);
      color: rgb(var(--gold));
    }

    .pane {
      border: 1px solid rgb(var(--border));
      border-radius: 12px;
      background: rgb(var(--card));
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }
    .pane-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgb(var(--border) / 0.7);
    }
    .pane-title {
      flex: 1;
      font-family: var(--serif);
      font-size: 1.1rem;
      color: rgb(var(--gold));
      margin: 0;
    }
    .seg {
      display: flex;
      overflow: hidden;
      border: 1px solid rgb(var(--border));
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .seg span { padding: 4px 10px; color: rgb(var(--ink-muted)); }
    .seg .on {
      background: rgb(var(--gold) / 0.2);
      color: rgb(var(--text));
      font-weight: 600;
    }
    .pane-body { flex: 1; background: rgb(var(--bg) / 0.55); }
    .pane-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-top: 1px solid rgb(var(--border) / 0.7);
    }
    .rail-btn {
      border: 1px solid rgb(var(--border));
      background: rgb(var(--slate));
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: rgb(var(--ink-muted));
    }
    .prep-btn {
      margin-left: auto;
      border: 0;
      border-radius: 12px;
      padding: 11px 26px;
      font-size: 1.1rem;
      font-weight: 650;
      background: rgb(var(--ink));
      color: rgb(var(--on-gold));
    }

    .ghead {
      display: grid;
      grid-template-columns: 22px 40px var(--frac-w) minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgb(var(--border) / 0.55);
      background: rgb(var(--bg) / 0.95);
    }
    .ghead .name {
      min-width: 0;
      font-size: 1.2rem;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ghead .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: end;
      font-size: 1rem;
    }
    .ghead .qty { color: rgb(var(--gold)); font-weight: 650; font-variant-numeric: tabular-nums; }
    .ghead .tables { font-weight: 650; font-variant-numeric: tabular-nums; }
    .ghead .link { color: rgb(var(--ink-muted)); font-size: 0.88rem; }

    .thumb {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(145deg, #d8d0c4, #b8aea0);
    }
    .thumb.table-ico {
      display: grid;
      place-items: center;
      background: rgb(var(--border) / 0.35);
      color: rgb(var(--ink-muted));
      font-size: 0.78rem;
      font-weight: 700;
    }

    .ghead.has-partial {
      background: rgb(var(--gold) / 0.1);
      box-shadow: inset 4px 0 0 0 rgb(var(--gold));
    }
    .ghead.has-all {
      background: rgb(var(--gold) / 0.18);
      box-shadow: inset 4px 0 0 0 rgb(var(--gold));
    }

    .gcheck {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid rgb(var(--border));
      background: rgb(var(--card));
      position: relative;
      padding: 0;
      justify-self: center;
    }
    .gcheck.partial {
      border-color: rgb(var(--gold));
      background: rgb(var(--card));
    }
    .gcheck.partial::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 50%;
      height: 2.5px;
      margin-top: -1px;
      border-radius: 1px;
      background: rgb(var(--gold));
    }
    .gcheck.all {
      border-color: rgb(var(--gold));
      background: rgb(var(--gold));
      box-shadow: inset 0 0 0 3px rgb(var(--card));
    }

    .frac {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      width: var(--frac-w);
      padding: 4px 0;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      justify-self: center;
    }
    .frac .n { font-size: 1.05rem; }
    .frac .slash {
      margin: 0 1px;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.75;
    }
    .frac .d { font-size: 0.92rem; opacity: 0.85; }
    .frac.zero {
      color: rgb(var(--ink-muted));
      box-shadow: inset 0 0 0 1px rgb(var(--border));
      background: transparent;
    }
    .frac.partial {
      color: rgb(var(--gold));
      box-shadow: inset 0 0 0 1.5px rgb(var(--gold));
      background: transparent;
    }
    .frac.all {
      color: rgb(var(--on-gold));
      background: rgb(var(--gold));
    }

    .key {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      align-items: center;
      font-size: 0.82rem;
      color: rgb(var(--ink-muted));
    }
    .key .pair { display: inline-flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>收起组头 · 已选提示</h1>
    <p class="lede">勾选 | 图 | <strong>n/m</strong>（未选 <strong>0/n</strong>）| 名称</p>

    <div class="grid">
      <div class="panel">
        <span class="tag">按菜</span>
        <div class="pane">
          <div class="pane-head">
            <h3 class="pane-title">生鱼</h3>
            <div class="seg"><span>按桌</span><span class="on">按菜</span></div>
          </div>
          <div class="pane-body">
            <div class="ghead">
              <button type="button" class="gcheck" title="全选"></button>
              <div class="thumb"></div>
              <span class="frac zero" aria-label="已选 0 / 1"><span class="n">0</span><span class="slash">/</span><span class="d">1</span></span>
              <div class="name">2001 鱼杂烩</div>
              <div class="meta">
                <span class="qty">共 1 份</span>
                <span class="tables">共 1 桌</span>
                <span class="link">展开</span>
              </div>
            </div>
            <div class="ghead has-partial">
              <button type="button" class="gcheck partial" title="全选"></button>
              <div class="thumb"></div>
              <span class="frac partial" aria-label="已选 2 / 3"><span class="n">2</span><span class="slash">/</span><span class="d">3</span></span>
              <div class="name">2202 三种鱼刺身</div>
              <div class="meta">
                <span class="qty">共 9 份</span>
                <span class="tables">共 2 桌</span>
                <span class="link">展开</span>
              </div>
            </div>
            <div class="ghead has-all">
              <button type="button" class="gcheck all" title="取消全选"></button>
              <div class="thumb"></div>
              <span class="frac all" aria-label="已选 1 / 1"><span class="n">1</span><span class="slash">/</span><span class="d">1</span></span>
              <div class="name">2203 三文鱼刺身</div>
              <div class="meta">
                <span class="qty">共 1 份</span>
                <span class="tables">共 1 桌</span>
                <span class="link">展开</span>
              </div>
            </div>
          </div>
          <div class="pane-foot">
            <div class="rail-btn">已备餐/已出餐 · 0</div>
            <button type="button" class="prep-btn">备餐</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <span class="tag">按桌</span>
        <div class="pane">
          <div class="pane-head">
            <h3 class="pane-title">生鱼</h3>
            <div class="seg"><span class="on">按桌</span><span>按菜</span></div>
          </div>
          <div class="pane-body">
            <div class="ghead has-partial">
              <button type="button" class="gcheck partial" title="全选"></button>
              <div class="thumb table-ico" aria-hidden="true">桌</div>
              <span class="frac partial" aria-label="已选 3 / 5"><span class="n">3</span><span class="slash">/</span><span class="d">5</span></span>
              <div class="name">90</div>
              <span class="link">展开</span>
            </div>
            <div class="ghead has-all">
              <button type="button" class="gcheck all" title="取消全选"></button>
              <div class="thumb table-ico" aria-hidden="true">桌</div>
              <span class="frac all" aria-label="已选 2 / 2"><span class="n">2</span><span class="slash">/</span><span class="d">2</span></span>
              <div class="name">91</div>
              <span class="link">展开</span>
            </div>
            <div class="ghead">
              <button type="button" class="gcheck" title="全选"></button>
              <div class="thumb table-ico" aria-hidden="true">桌</div>
              <span class="frac zero" aria-label="已选 0 / 4"><span class="n">0</span><span class="slash">/</span><span class="d">4</span></span>
              <div class="name">92</div>
              <span class="link">展开</span>
            </div>
          </div>
          <div class="pane-foot">
            <div class="rail-btn">已备餐/已出餐 · 0</div>
            <button type="button" class="prep-btn">备餐</button>
          </div>
        </div>
      </div>
    </div>

    <div class="key">
      <span class="pair"><span class="frac zero"><span class="n">0</span><span class="slash">/</span><span class="d">3</span></span> 未选</span>
      <span class="pair"><span class="frac partial"><span class="n">2</span><span class="slash">/</span><span class="d">3</span></span> 部分</span>
      <span class="pair"><span class="frac all"><span class="n">3</span><span class="slash">/</span><span class="d">3</span></span> 全选</span>
    </div>
  </div>
</body>
</html>
