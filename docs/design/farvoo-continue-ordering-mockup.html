<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FARVOO · 继续点餐</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE2;
    --paper-card: #F7F4EE;
    --ink: #2B2620;
    --ink-soft: #8A8377;
    --azulejo: #1F3E52;
    --azulejo-line: rgba(31,62,82,0.16);
    --gold: #A9814A;
  }
  body{ background: var(--paper); font-family:'Jost','Noto Sans SC',sans-serif; color: var(--ink); }
  .font-serif-en{ font-family:'Cormorant Garamond',serif; }
  .font-serif-cn{ font-family:'Noto Serif SC',serif; }
  /* Artistic euro price — self-hosted look via Google CDN + italic old-style figures */
  .mesa-money{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-style:normal;
    font-variant-numeric: oldstyle-nums;
    font-feature-settings: "onum" 1;
    line-height: 1.25;
  }

  /* photo-corner mount frame — four open L-brackets instead of a closed box,
     a small gold pin marks the top-left, echoing the single-dot motif used elsewhere */
  .corner-frame{ position:relative; padding:14px 16px; }
  .corner-frame::before, .corner-frame::after,
  .corner-frame .c-tr, .corner-frame .c-br{
    content:"";
    position:absolute;
    width:11px; height:11px;
    border-color: var(--azulejo);
    border-style: solid;
    border-width: 0;
  }
  .corner-frame::before{ top:0; left:0; border-top-width:1.4px; border-left-width:1.4px; }
  .corner-frame::after{ bottom:0; left:0; border-bottom-width:1.4px; border-left-width:1.4px; }
  .corner-frame .c-tr{ top:0; right:0; border-top-width:1.4px; border-right-width:1.4px; }
  .corner-frame .c-br{ bottom:0; right:0; border-bottom-width:1.4px; border-right-width:1.4px; }
  .corner-frame .pin{
    position:absolute; top:0; left:0;
    width:4px; height:4px; border-radius:50%;
    background: var(--gold);
    transform: translate(-1.5px,-1.5px);
  }

  .dot-active::after{ content:""; display:block; width:3px; height:3px; border-radius:50%; background: var(--gold); margin: 6px auto 0; }
  .tabs-fade{ -webkit-mask-image: linear-gradient(to right, black 92%, transparent 100%); mask-image: linear-gradient(to right, black 92%, transparent 100%); }
  ::-webkit-scrollbar{ height:0; width:0; }
</style>
</head>

<body class="min-h-screen">
<div class="max-w-[440px] mx-auto min-h-screen flex flex-col" style="background:var(--paper);">

  <div class="px-6 pt-8 pb-4">
    <div class="flex items-baseline justify-between mb-1">
      <h1 class="font-serif-cn text-[19px]">继续点餐</h1>
      <button aria-label="关闭" class="text-[13px]" style="color:var(--ink-soft);">✕ 关闭</button>
    </div>
    <div class="flex items-baseline justify-between mt-5">
      <span class="font-serif-en text-[15px] font-medium tracking-wide" style="color:var(--azulejo);">白云餐厅</span>
      <span class="text-[11px] px-3 py-1 rounded-full" style="border:0.5px solid var(--azulejo-line); color:var(--azulejo);">桌号 A-04</span>
    </div>
  </div>

  <div class="px-6 pb-4 tabs-fade">
    <div class="flex gap-7 overflow-x-auto pb-1" style="scrollbar-width:none;">
      <div class="dot-active shrink-0"><span class="text-[13px] font-medium whitespace-nowrap" style="color:var(--azulejo);">饮料</span></div>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">鸡尾酒</span>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">茶</span>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">水果酒 / 香槟</span>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">红酒</span>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">白葡萄酒</span>
      <span class="text-[13px] whitespace-nowrap shrink-0" style="color:var(--ink-soft);">威士忌 / 白兰地</span>
    </div>
    <div class="mt-3" style="border-bottom:0.5px solid var(--azulejo-line);"></div>
  </div>

  <div class="flex-1 px-6 space-y-4 pb-28 overflow-y-auto">

    <div class="corner-frame" style="background:var(--paper-card);">
      <span class="c-tr"></span><span class="c-br"></span><span class="pin"></span>
      <div class="flex items-center gap-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" class="shrink-0"><path d="M9 2h6v3.5l1.5 2.5v12a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-12L9 5.5V2z"/></svg>
        <div class="flex-1 min-w-0">
          <span class="font-serif-cn text-[14.5px]">中水</span>
          <span class="text-[10px] ml-2" style="color:var(--ink-soft);">001</span>
        </div>
        <span class="mesa-money text-[15px] shrink-0" style="color:var(--gold);">€1.85</span>
        <button aria-label="添加 中水" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="border:1px solid var(--azulejo); color:var(--azulejo);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="corner-frame" style="background:var(--paper-card);">
      <span class="c-tr"></span><span class="c-br"></span><span class="pin"></span>
      <div class="flex items-center gap-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" class="shrink-0"><path d="M9 2h6v3.5l1.5 2.5v12a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-12L9 5.5V2z"/></svg>
        <div class="flex-1 min-w-0">
          <span class="font-serif-cn text-[14.5px]">冰水 500毫升</span>
          <span class="text-[10px] ml-2" style="color:var(--ink-soft);">002</span>
        </div>
        <span class="mesa-money text-[15px] shrink-0" style="color:var(--gold);">€1.85</span>
        <button aria-label="添加 冰水 500毫升" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="border:1px solid var(--azulejo); color:var(--azulejo);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="corner-frame" style="background:var(--paper-card);">
      <span class="c-tr"></span><span class="c-br"></span><span class="pin"></span>
      <div class="flex items-center gap-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" class="shrink-0"><path d="M9 2h6v3.5l1.5 2.5v12a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-12L9 5.5V2z"/></svg>
        <div class="flex-1 min-w-0">
          <span class="font-serif-cn text-[14.5px]">冰 Vitalis 750ml</span>
          <span class="text-[10px] ml-2" style="color:var(--ink-soft);">003</span>
        </div>
        <span class="mesa-money text-[15px] shrink-0" style="color:var(--gold);">€2.50</span>
        <button aria-label="添加 冰 Vitalis 750ml" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="border:1px solid var(--azulejo); color:var(--azulejo);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="corner-frame" style="background:var(--paper-card);">
      <span class="c-tr"></span><span class="c-br"></span><span class="pin"></span>
      <div class="flex items-center gap-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" class="shrink-0"><path d="M9 2h6v3.5l1.5 2.5v12a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-12L9 5.5V2z"/></svg>
        <div class="flex-1 min-w-0">
          <span class="font-serif-cn text-[14.5px]">Vitalis 750ml</span>
          <span class="text-[10px] ml-2" style="color:var(--ink-soft);">004</span>
        </div>
        <span class="mesa-money text-[15px] shrink-0" style="color:var(--gold);">€2.50</span>
        <button aria-label="添加 Vitalis 750ml" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="border:1px solid var(--azulejo); color:var(--azulejo);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <!-- selected / in-cart state — pin turns to the accent color used for "in progress" elsewhere -->
    <div class="corner-frame" style="background:var(--paper-card);">
      <span class="c-tr" style="border-color:#A6604A;"></span><span class="c-br" style="border-color:#A6604A;"></span>
      <span class="pin" style="background:#A6604A;"></span>
      <div class="flex items-center gap-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A6604A" stroke-width="1.3" class="shrink-0"><path d="M6 3h9l3 4-9 15L3 7l3-4z"/></svg>
        <div class="flex-1 min-w-0">
          <span class="font-serif-cn text-[14.5px]">可乐</span>
          <span class="text-[10px] ml-2" style="color:var(--ink-soft);">006</span>
        </div>
        <span class="mesa-money text-[15px] shrink-0" style="color:var(--gold);">€2.20</span>
        <div class="flex items-center gap-3 shrink-0">
          <button aria-label="减少" class="w-6 h-6 rounded-full flex items-center justify-center" style="border:1px solid #A6604A; color:#A6604A;">−</button>
          <span class="text-[13px] w-3 text-center">2</span>
          <button aria-label="增加" class="w-6 h-6 rounded-full flex items-center justify-center" style="border:1px solid #A6604A; color:#A6604A;">+</button>
        </div>
      </div>
    </div>

  </div>

  <div class="sticky bottom-0 px-6 pb-6 pt-3" style="background:linear-gradient(to top, var(--paper) 70%, transparent);">
    <div class="corner-frame" style="background:var(--azulejo); padding:12px 16px;">
      <span class="c-tr" style="border-color:var(--gold);"></span><span class="c-br" style="border-color:var(--gold);"></span>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F7F4EE" stroke-width="1.6"><path d="M4 4h2l2 12h10l2-8H7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
          <div class="text-[12px]" style="color:#DCE3E7;">
            已点 <span style="color:#F7F4EE;">3</span> 份 · 合计 <span class="mesa-money" style="color:#F7F4EE;">€33.65</span>
          </div>
        </div>
        <button class="text-[12px] flex items-center gap-1" style="color:#F7F4EE;">
          去结算
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F7F4EE" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
