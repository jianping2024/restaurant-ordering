# Mesa on-prem POC stack (②+③)
#
# Mode A (recommended for Mac/Linux POC today):
#   1. supabase start && apply migrations
#   2. ./scripts/generate-env.sh   # writes .env (gitignored)
#   3. docker compose up --build web
# Web reaches host Supabase via host.docker.internal:54321
#
# Full self-hosted Supabase-in-Compose (customer Windows path) lands with
# install hardening (step ⑤); this file proves production Web + local DB.

name: mesa-on-prem

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle (host loopback for Mode A).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "${MESA_WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MESA_ON_PREM: "1"
      # Server runtime (not build-inlined): container → host supabase.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      PRINT_AGENT_JWT_SECRET: ${PRINT_AGENT_JWT_SECRET}
      STAFF_SESSION_SECRET: ${STAFF_SESSION_SECRET:-}
      ORDER_ENQUEUE_SECRET: ${ORDER_ENQUEUE_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
